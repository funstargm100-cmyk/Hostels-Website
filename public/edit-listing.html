<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Listing — Roomy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand"><i data-lucide="home"></i> <span class="brand-roomy">Roomy</span></a>
      <ul class="navbar-nav" id="navMenu">
        <li><a href="/">Home</a></li>
        <li><a href="/dashboard">Dashboard</a></li>
        <li class="nav-auth-mobile">
          <a href="/dashboard" class="btn btn-outline" id="dashboardBtnMobile">Dashboard</a>
          <button class="btn btn-ghost" id="logoutBtnMobile">Logout</button>
        </li>
      </ul>
      <div class="navbar-actions">
        <button class="theme-toggle" id="themeToggle"><i data-lucide="moon"></i></button>
        <a href="/dashboard" class="btn btn-outline btn-sm" id="dashboardBtn">Dashboard</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Logout</button>
        <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      </div>
    </div>
  </nav>

  <div class="container page-in" style="max-width:720px;padding-top:1.5rem;padding-bottom:3rem">
    <a href="/dashboard#listings"
      style="color:var(--text-muted);font-size:0.875rem;display:inline-flex;align-items:center;gap:0.3rem;margin-bottom:1rem"><i
        data-lucide="arrow-left" style="width:15px;height:15px"></i> Back to dashboard</a>

    <div id="editLoading" class="spinner-center"><span class="spinner spinner-lg"></span>Loading your listing...</div>

    <div id="editContent" style="display:none">
      <div class="card" style="padding:1.5rem;margin-bottom:1.25rem">
        <h2 class="mb-1">Edit Listing</h2>
        <p class="text-muted">Changes go to admin review before going live again.</p>
        <div id="currentPhotos"
          style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:0.5rem;margin-top:1rem">
        </div>
      </div>

      <form id="editForm" class="card" style="padding:1.5rem">
        <div class="form-group">
          <label class="form-label">Title *</label>
          <input type="text" class="form-control" id="edTitle" required maxlength="120" />
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-control" id="edDescription" rows="4" maxlength="1200"></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem" class="mb-2">
          <div class="form-group">
            <label class="form-label">Price (GHS) *</label>
            <input type="number" class="form-control" id="edPrice" required min="1" />
          </div>
          <div class="form-group">
            <label class="form-label">Occupancy *</label>
            <select class="form-control" id="edOccupancy">
              <option value="1">1-in-1 (Self contained)</option>
              <option value="2">2-in-1</option>
              <option value="3">3-in-1</option>
              <option value="4">4-in-1</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Location Area *</label>
          <input type="text" class="form-control" id="edLocation" required />
        </div>
        <div class="form-group">
          <label class="form-label">Nearest Landmark</label>
          <input type="text" class="form-control" id="edLandmark" />
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem" class="mb-2">
          <div class="form-group">
            <label class="form-label">Water</label>
            <select class="form-control" id="edWater">
              <option value="constant">Constant</option>
              <option value="intermittent">Intermittent</option>
              <option value="borehole">Borehole</option>
              <option value="none">None</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Electricity</label>
            <select class="form-control" id="edElectricity">
              <option value="prepaid">Prepaid Meter</option>
              <option value="postpaid">Postpaid</option>
              <option value="generator">Generator Backup</option>
              <option value="none">None</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Furnishing</label>
            <select class="form-control" id="edFurnishing">
              <option value="furnished">Furnished</option>
              <option value="semi-furnished">Semi-Furnished</option>
              <option value="unfurnished">Unfurnished</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Bathroom</label>
            <select class="form-control" id="edBathroom">
              <option value="private">Private</option>
              <option value="shared">Shared</option>
            </select>
          </div>
        </div>
        <div class="checkbox-group mb-3">
          <label class="checkbox-item"><input type="checkbox" id="edWifi" /> Wi-Fi</label>
          <label class="checkbox-item"><input type="checkbox" id="edKitchen" /> Kitchen Access</label>
          <label class="checkbox-item"><input type="checkbox" id="edParking" /> Parking</label>
          <label class="checkbox-item"><input type="checkbox" id="edPets" /> Pet Friendly</label>
        </div>
        <div class="alert alert-info mb-2"><i data-lucide="info" style="width:16px;height:16px;flex-shrink:0"></i>
          Editing resubmits the listing for admin approval. Availability can be toggled instantly from the dashboard.
        </div>
        <div class="form-error mb-1" id="editError" style="display:none"></div>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap">
          <button type="submit" class="btn btn-primary btn-lg" id="editSubmitBtn" style="flex:1"><i
              data-lucide="save"></i> Save Changes</button>
          <a href="/dashboard#listings" class="btn btn-ghost btn-lg">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/edit-listing.js"></script>
  <script>lucide.createIcons();</script>
</body>

</html>
