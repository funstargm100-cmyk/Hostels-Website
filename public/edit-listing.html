<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Edit listing — Roomy</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="toastContainer"></div>

<nav class="navbar" id="mainNav">
  <div class="nav-inner">
    <a href="/" class="logo">roomy<span class="dot">.</span></a>
    <div class="nav-links">
      <a href="/listings">Browse rooms</a>
      <a href="/post-ad">Post a room</a>
      <a href="/about">About</a>
    </div>
    <div class="nav-actions">
      <button id="themeToggle" aria-label="Toggle theme"></button>
      <a href="/login" id="loginBtn" class="btn btn-ghost btn-sm">Log in</a>
      <a href="/signup" id="signupBtn" class="btn btn-primary btn-sm">Sign up</a>
      <a href="/dashboard" id="dashboardBtn" class="btn btn-outline btn-sm" style="display:none">Dashboard</a>
      <button id="logoutBtn" class="btn btn-ghost btn-sm" style="display:none">Log out</button>
    </div>
  </div>
</nav>

<div class="container" style="max-width:760px;padding-top:2.5rem;padding-bottom:4rem">
  <div id="editLoading" class="spinner-center"><span class="spinner spinner-lg"></span>Loading listing...</div>

  <div id="editContent" style="display:none">
    <h1 style="font-size:1.8rem">Edit listing</h1>
    <p class="text-muted mb-3">Changes are resubmitted for a quick admin review.</p>

    <div class="alert alert-danger" id="editError" style="display:none"></div>

    <form id="editForm">
      <div class="form-group"><label>Title</label><input type="text" id="edTitle" required /></div>
      <div class="form-group"><label>Description</label><textarea id="edDescription"></textarea></div>

      <div class="form-row">
        <div class="form-group"><label>Price (GHS/month)</label><input type="number" id="edPrice" required /></div>
        <div class="form-group">
          <label>Occupancy type</label>
          <select id="edOccupancy"><option value="1">Self-contained</option><option value="2">2-in-1</option><option value="3">3-in-1</option><option value="4">4-in-1</option></select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group"><label>Location area</label><input type="text" id="edLocation" required /></div>
        <div class="form-group"><label>Nearest landmark</label><input type="text" id="edLandmark" /></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Water supply</label>
          <select id="edWater"><option value="constant">Constant</option><option value="intermittent">Intermittent</option><option value="borehole">Borehole</option><option value="none">None</option></select>
        </div>
        <div class="form-group">
          <label>Electricity</label>
          <select id="edElectricity"><option value="prepaid">Prepaid meter</option><option value="postpaid">Postpaid</option><option value="generator">Generator backup</option><option value="none">None</option></select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Furnishing</label>
          <select id="edFurnishing"><option value="unfurnished">Unfurnished</option><option value="semi-furnished">Semi-furnished</option><option value="furnished">Furnished</option></select>
        </div>
        <div class="form-group">
          <label>Bathroom</label>
          <select id="edBathroom"><option value="private">Private</option><option value="shared">Shared</option></select>
        </div>
      </div>

      <div class="checkbox-row mb-1"><input type="checkbox" id="edWifi" /><label style="margin:0">Wi-Fi available</label></div>
      <div class="checkbox-row mb-1"><input type="checkbox" id="edKitchen" /><label style="margin:0">Kitchen access</label></div>
      <div class="checkbox-row mb-1"><input type="checkbox" id="edParking" /><label style="margin:0">Parking available</label></div>
      <div class="checkbox-row mb-3"><input type="checkbox" id="edPets" /><label style="margin:0">Pet friendly</label></div>

      <h3>Current photos</h3>
      <div class="photo-preview mb-3" id="currentPhotos"></div>

      <div style="display:flex;gap:.7rem">
        <button type="submit" class="btn btn-primary" id="editSubmitBtn">Save changes</button>
        <a href="/dashboard#listings" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>

<nav class="footer-nav" id="footerNav" data-mode="visitor"></nav>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<script src="/js/app.js" defer></script>
<script src="/js/edit-listing.js" defer></script>
<script src="/js/footernav.js" defer></script>
<script src="/js/animations.js" defer></script>
<script src="/js/scrolltop.js" defer></script>
</body>
</html>
