<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in — Roomy</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="toastContainer"></div>

<nav class="navbar" id="mainNav">
  <div class="nav-inner">
    <a href="/" class="logo">roomy<span class="dot">.</span></a>
    <div class="nav-links">
      <a href="/listings">Browse rooms</a>
      <a href="/post-ad">Post a room</a>
      <a href="/about">About</a>
    </div>
    <div class="nav-actions">
      <button id="themeToggle" aria-label="Toggle theme"></button>
    </div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <div class="logo mb-1">roomy<span class="dot">.</span></div>
    <h2 style="font-size:1.4rem">Welcome back</h2>
    <p class="text-muted mb-3" style="margin-top:-.4rem">Log in to manage your listings or requests.</p>

    <div class="alert alert-danger" id="loginError" style="display:none"></div>

    <div class="alert alert-info" id="verifyBanner" style="display:none"></div>

    <form id="verifyForm" style="display:none">
      <input type="hidden" id="verifyUuid" />
      <div class="form-group">
        <label>Verification code</label>
        <input type="text" id="verifyOtp" inputmode="numeric" maxlength="6" placeholder="6-digit code" required />
      </div>
      <p class="text-muted" id="otpCountdown" style="font-size:.85rem"></p>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%" id="verifySubmitBtn">Verify account</button>
      <button type="button" class="btn btn-ghost" style="width:100%;margin-top:.5rem" id="resendBtn">Resend code</button>
    </form>

    <form id="loginForm">
      <div class="form-group">
        <label>Email or phone</label>
        <input type="text" id="loginIdentifier" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%" id="loginSubmitBtn">Log in</button>
    </form>

    <p class="text-muted mt-3" id="loginFootnote" style="text-align:center;font-size:.88rem">New to Roomy? <a href="/signup" style="color:var(--primary);font-weight:700">Create an account</a></p>
  </div>
</div>

<footer class="site-footer" style="padding:2rem 0">
  <div class="container footer-bottom" style="border-top:none">
    <span>© 2026 Roomy.</span>
    <a href="/about">About &amp; safety</a>
  </div>
</footer>

<nav class="footer-nav" id="footerNav"></nav>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<script src="/js/app.js" defer></script>
<script src="/js/footernav.js" defer></script>
<script src="/js/animations.js" defer></script>
<script src="/js/scrolltop.js" defer></script>
<script defer>
const errEl0 = document.getElementById('loginError');
const verifyForm = document.getElementById('verifyForm');
const loginForm = document.getElementById('loginForm');
const countdownEl = document.getElementById('otpCountdown');

const OTP_TTL = 10 * 60 * 1000;     // must match server (10 min)
const RESEND_COOLDOWN = 30 * 1000;  // wait between resend attempts
let otpSentAt = 0;
let countdownTimer = null;

function fmt(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function startCountdown(sentAtMs) {
  otpSentAt = sentAtMs;
  clearInterval(countdownTimer);
  const tick = () => {
    const elapsed = Date.now() - otpSentAt;
    const left = OTP_TTL - elapsed;
    const cooldownLeft = RESEND_COOLDOWN - elapsed;
    const resendBtn = document.getElementById('resendBtn');
    if (left > 0) {
      countdownEl.textContent = 'Code expires in ' + fmt(left) + '. Request a new one if it lapses.';
    } else {
      countdownEl.textContent = 'Your code has expired. Click "Resend code" to get a fresh one.';
      clearInterval(countdownTimer);
      countdownTimer = null;
    }
    if (cooldownLeft > 0) {
      resendBtn.disabled = true;
      resendBtn.textContent = 'Resend code (' + fmt(cooldownLeft) + ')';
    } else {
      resendBtn.disabled = false;
      resendBtn.textContent = 'Resend code';
    }
  };
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function showVerifyPanel(uuid, email, bannerMsg, sentAtMs) {
  document.getElementById('verifyUuid').value = uuid || '';
  document.getElementById('verifyBanner').textContent = bannerMsg ||
    'Your account is not verified yet.' + (email ? ' We sent a code to ' + email + '.' : '');
  document.getElementById('verifyBanner').style.display = 'block';
  verifyForm.style.display = 'block';
  loginForm.style.display = 'none';
  document.getElementById('loginFootnote').style.display = 'none';
  startCountdown(sentAtMs || Date.now());
}

// Arrived from signup with a pending verification
const params = new URLSearchParams(location.search);
if (params.get('verify') === '1' && params.get('uuid')) {
  showVerifyPanel(params.get('uuid'), params.get('email') || '',
    'Account created! Enter the verification code we emailed to ' + (params.get('email') || 'you') + '.',
    parseInt(params.get('t') || '0', 10) || Date.now());
}

verifyForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('verifySubmitBtn');
  const otp = document.getElementById('verifyOtp').value.trim();
  const uuid = document.getElementById('verifyUuid').value;
  btn.disabled = true; btn.classList.add('btn-loading');
  try {
    const res = await api.post('/api/auth/verify-otp', { uuid, otp });
    document.getElementById('verifyBanner').textContent = res.message || 'Account verified successfully! You can now log in.';
    document.getElementById('verifyBanner').className = 'alert alert-success';
    verifyForm.style.display = 'none';
    loginForm.style.display = 'block';
    document.getElementById('loginFootnote').style.display = 'block';
  } catch (ex) {
    errEl0.textContent = ex.message; errEl0.style.display = 'block';
  } finally {
    btn.disabled = false; btn.classList.remove('btn-loading');
  }
});

document.getElementById('resendBtn').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  const uuid = document.getElementById('verifyUuid').value;
  if (!uuid) { errEl0.textContent = 'Log in first so we can identify your account.'; errEl0.style.display = 'block'; return; }
  btn.disabled = true; btn.classList.add('btn-loading');
  try {
    const res = await api.post('/api/auth/resend-otp', { uuid });
    document.getElementById('verifyBanner').textContent = res.message;
    document.getElementById('verifyBanner').className = 'alert alert-info';
    errEl0.style.display = 'none';
    startCountdown(Date.now());
  } catch (ex) {
    errEl0.textContent = ex.message; errEl0.style.display = 'block';
  } finally {
    btn.disabled = false; btn.classList.remove('btn-loading');
  }
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginSubmitBtn');
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  btn.disabled = true; btn.classList.add('btn-loading');
  try {
    const identifier = document.getElementById('loginIdentifier').value.trim();
    const password = document.getElementById('loginPassword').value;
    const body = { identifier, password };
    const { token, user } = await api.post('/api/auth/login', body);
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(user));
    const params = new URLSearchParams(location.search);
    location.href = params.get('redirect') || (window.goHomeForRole ? goHomeForRole(user.role) : '/dashboard');
  } catch (ex) {
    if (ex.needVerification || (ex.data && ex.data.needVerification)) {
      const info = ex.data || ex;
      showVerifyPanel(info.uuid, info.email, info.error || ex.message);
      errEl.style.display = 'none';
    } else {
      errEl.textContent = ex.message;
      errEl.style.display = 'block';
    }
    btn.disabled = false; btn.classList.remove('btn-loading');
  }
});
</script>
</body>
</html>
