<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Roomy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #fff0f0 0%, #f0fffe 100%); padding: 2rem 1rem; }
    [data-theme="dark"] .auth-page { background: linear-gradient(135deg, #1e0a0a 0%, #0a1e1d 100%); }
    .auth-card { background: var(--bg); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 2.5rem; width: 100%; max-width: 420px; }
    .auth-logo { text-align: center; margin-bottom: 1.5rem; }
    .auth-logo a { font-family: var(--font-head); font-size: 1.6rem; font-weight: 700; color: var(--primary); }
    .auth-logo a span { color: var(--text); }
    .auth-divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.25rem 0; color: var(--text-muted); font-size: 0.82rem; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" style="position:fixed;top:1rem;right:1rem;z-index:100"><i data-lucide="moon"></i></button>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo"><a href="/"><i data-lucide="home"></i> Roomy</a></div>
      <h2 style="text-align:center;margin-bottom:0.25rem">Welcome back</h2>
      <p class="text-muted text-center mb-3" style="font-size:0.875rem">Sign in to your account</p>

      <div id="loginError" class="alert alert-danger" style="display:none"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email or Phone</label>
          <input type="text" class="form-control" id="loginIdentifier" placeholder="email@example.com or 0244..." required autocomplete="username" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPassword" required autocomplete="current-password" />
        </div>
        <div style="text-align:right;margin-bottom:1rem">
          <a href="/forgot-password" style="font-size:0.82rem;color:var(--primary)">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">Sign In</button>
      </form>

      <div class="auth-divider">or</div>
      <p style="text-align:center;font-size:0.875rem">Don't have an account? <a href="/signup" style="color:var(--primary);font-weight:600">Sign up free</a></p>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      btn.disabled = true; btn.textContent = 'Signing in...';
      err.style.display = 'none';
      try {
        const res = await api.post('/api/auth/login', {
          identifier: document.getElementById('loginIdentifier').value,
          password: document.getElementById('loginPassword').value
        });
        localStorage.setItem('token', res.token);
        localStorage.setItem('user', JSON.stringify(res.user));
        const redirect = new URLSearchParams(location.search).get('redirect') || (res.user.role === 'admin' ? '/admin' : '/dashboard');
        location.href = redirect;
      } catch (ex) {
        err.textContent = ex.message || 'Login failed';
        err.style.display = 'flex';
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    }
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
