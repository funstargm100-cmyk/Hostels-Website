<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in — Roomy</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="toastContainer"></div>

<nav class="navbar" id="mainNav">
  <div class="nav-inner">
    <a href="/" class="logo">roomy<span class="dot">.</span></a>
    <div class="nav-links">
      <a href="/listings">Browse rooms</a>
      <a href="/post-ad">Post a room</a>
      <a href="/about">About</a>
    </div>
    <div class="nav-actions">
      <button id="themeToggle" aria-label="Toggle theme"></button>
    </div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <div class="logo mb-1">roomy<span class="dot">.</span></div>
    <h2 style="font-size:1.4rem">Welcome back</h2>
    <p class="text-muted mb-3" style="margin-top:-.4rem">Log in to manage your listings or requests.</p>

    <div class="alert alert-danger" id="loginError" style="display:none"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email or phone</label>
        <input type="text" id="loginIdentifier" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%" id="loginSubmitBtn">Log in</button>
    </form>

    <p class="text-muted mt-3" style="text-align:center;font-size:.88rem">New to Roomy? <a href="/signup" style="color:var(--primary);font-weight:700">Create an account</a></p>
  </div>
</div>

<footer class="site-footer" style="padding:2rem 0">
  <div class="container footer-bottom" style="border-top:none">
    <span>© 2026 Roomy.</span>
    <a href="/about">About &amp; safety</a>
  </div>
</footer>

<nav class="footer-nav" id="footerNav"></nav>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<script src="/js/app.js" defer></script>
<script src="/js/footernav.js" defer></script>
<script src="/js/animations.js" defer></script>
<script defer>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginSubmitBtn');
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  btn.disabled = true; btn.classList.add('btn-loading');
  try {
    const identifier = document.getElementById('loginIdentifier').value.trim();
    const password = document.getElementById('loginPassword').value;
    const body = { identifier, password };
    const { token, user } = await api.post('/api/auth/login', body);
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(user));
    const params = new URLSearchParams(location.search);
    location.href = params.get('redirect') || '/dashboard';
  } catch (ex) {
    errEl.textContent = ex.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.classList.remove('btn-loading');
  }
});
</script>
</body>
</html>
