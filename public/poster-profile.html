<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
   <title>Ad poster profile — Rentel</title>
   <link rel="icon" type="image/png" href="/favicon.png" />
   <link rel="apple-touch-icon" href="/images/icon-192.png" />
   <link rel="stylesheet" href="/css/style.css" />
  </head>

<body>

  <div id="toastContainer"></div>

  <nav class="navbar" id="mainNav">
    <div class="nav-inner">
      <a href="/" class="logo"><img class="rentel-icon" src="/images/rentel_icon.png" alt="Rentel icon"><img class="rentel-wordmark" src="/images/rentel_wordmark_ink.png" alt="Rentel"></a>
      <div class="nav-links">
        <a href="/listings">Browse rooms</a>
        <a href="/post-ad">Post a room</a>
        <a href="/about">About</a>
      </div>
      <div class="nav-actions">
        <button id="themeToggle" aria-label="Toggle theme"></button>
        <a href="/login" id="loginBtn" class="btn btn-ghost btn-sm">Log in</a>
        <a href="/signup" id="signupBtn" class="btn btn-primary btn-sm">Sign up</a>
        <a href="/dashboard" id="dashboardBtn" class="btn btn-outline btn-sm" style="display:none">Dashboard</a>
                      <button id="logoutBtn" class="btn btn-ghost btn-sm" style="display:none">Log out</button>
                    </div>
                  </div>
               </nav>

  <div class="container" style="padding-top:2rem">

    <button class="back-btn" onclick="goBack('/listings')"><i data-lucide="arrow-left"></i> Back</button>

    <div id="profileSkeleton">
      <div class="skeleton skeleton-text w-40" style="height:32px"></div>
      <div class="skeleton skeleton-text w-60 mt-1"></div>
    </div>

    <div id="profileContent" style="display:none">
      <header class="poster-header">
        <div class="poster-header-avatar sidebar-avatar" id="posterAvatar">O</div>
        <div class="poster-header-info">
          <h1 class="poster-header-name" id="posterName"></h1>
          <div class="poster-header-meta text-muted" id="posterMeta"></div>
          <div class="poster-header-since text-muted" id="memberSince"></div>
        </div>
        <div class="poster-header-follow">
          <div class="poster-header-actions">
            <button class="btn btn-primary" id="followBtn" onclick="toggleFollow()">
              <i data-lucide="user-plus"></i> <span id="followBtnLabel">Follow</span>
            </button>
            <button type="button" class="btn btn-outline poster-share-btn" id="shareProfileBtn" onclick="shareProfile()" aria-label="Share this profile" title="Share this profile">
              <i data-lucide="share-2"></i> <span>Share</span>
            </button>
          </div>
          <div class="poster-header-followers text-muted" id="followerCount"></div>
        </div>
      </header>

      <h2 class="poster-rooms-heading" id="roomsHeading">Rooms by this Agent</h2>
      <div class="grid-3" id="posterListings"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top:none;padding-top:0">
        <span>© 2026 Rentel. All rights reserved.</span>
        <a href="/about">About &amp; safety</a>
      </div>
    </div>
  </footer>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/poster-profile.js" defer></script>
  <script src="/js/footernav.js" defer></script>
</body>

</html>
