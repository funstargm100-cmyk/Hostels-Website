<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Roomy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand"><i data-lucide="home"></i> Roomy</a>
      <ul class="navbar-nav" id="navMenu">
        <li><a href="/">Home</a></li>
        <li><a href="/listings">Browse Rooms</a></li>
        <li><a href="/post-ad">Post a Room</a></li>
        <li class="nav-auth-mobile">
          <a href="/dashboard" class="btn btn-outline" id="dashboardBtnMobile">Dashboard</a>
          <button class="btn btn-ghost" id="logoutBtnMobile">Logout</button>
        </li>
      </ul>
      <div class="navbar-actions">
        <button class="theme-toggle" id="themeToggle"><i data-lucide="moon"></i></button>
        <a href="/dashboard" class="btn btn-outline btn-sm" id="dashboardBtn">Dashboard</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Logout</button>
        <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="dashboard-layout">
      <aside class="sidebar">
        <div style="text-align:center;padding:1rem 0;border-bottom:1px solid var(--border);margin-bottom:1rem">
          <div style="width:60px;height:60px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;margin:0 auto 0.5rem"><i data-lucide="user" style="width:28px;height:28px;color:var(--primary)"></i></div>
          <div style="font-weight:600" id="sidebarName">Loading...</div>
          <div class="text-muted" style="font-size:0.78rem" id="sidebarRole"></div>
        </div>
        <ul class="sidebar-nav">
          <li><a href="#overview" class="active" onclick="showTab('overview',this)"><i data-lucide="layout-dashboard"></i> Overview</a></li>
          <li id="myRequestsNav"><a href="#requests" onclick="showTab('requests',this)"><i data-lucide="message-circle"></i> My Requests</a></li>
          <li id="myListingsNav" style="display:none"><a href="#listings" onclick="showTab('listings',this)"><i data-lucide="building-2"></i> My Listings</a></li>
          <li><a href="#favorites" onclick="showTab('favorites',this)"><i data-lucide="heart"></i> Favorites</a></li>
          <li><a href="#notifications" onclick="showTab('notifications',this)"><i data-lucide="bell"></i> Notifications</a></li>
        </ul>
      </aside>

      <main>
        <div id="tab-overview">
          <h2 class="mb-3">Overview</h2>
          <div class="stat-cards" id="statCards"></div>
          <div class="card" style="padding:1.25rem">
            <h3 class="mb-2">Recent Activity</h3>
            <div id="recentActivity"><p class="text-muted" style="font-size:0.875rem">No recent activity.</p></div>
          </div>
        </div>

        <div id="tab-requests" style="display:none">
          <h2 class="mb-3">My Contact Requests</h2>
          <div id="requestsList"></div>
        </div>

        <div id="tab-listings" style="display:none">
          <div class="flex-between mb-3">
            <h2>My Listings</h2>
            <a href="/post-ad" class="btn btn-primary">+ Post New Room</a>
          </div>
          <div id="ownerListings"></div>
        </div>

        <div id="tab-favorites" style="display:none">
          <h2 class="mb-3">Saved Listings</h2>
          <div class="grid-2" id="favoritesList"></div>
        </div>

        <div id="tab-notifications" style="display:none">
          <h2 class="mb-3">Notifications</h2>
          <div id="notificationsList"></div>
        </div>
      </main>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dashboard.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
