<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard — Roomy</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="toastContainer"></div>

<nav class="navbar" id="mainNav">
  <div class="nav-inner">
    <a href="/" class="logo">roomy<span class="dot">.</span></a>
    <div class="nav-links">
      <a href="/listings">Browse rooms</a>
      <a href="/post-ad">Post a room</a>
      <a href="/about">About</a>
    </div>
    <div class="nav-actions">
      <button id="themeToggle" aria-label="Toggle theme"></button>
      <a href="/login" id="loginBtn" class="btn btn-ghost btn-sm">Log in</a>
      <a href="/signup" id="signupBtn" class="btn btn-primary btn-sm">Sign up</a>
      <a href="/dashboard" id="dashboardBtn" class="btn btn-outline btn-sm" style="display:none">Dashboard</a>
      <button id="logoutBtn" class="btn btn-ghost btn-sm" style="display:none">Log out</button>
    </div>
  </div>
</nav>

<div class="dashboard-topbar">
  <button id="sidebarMobileToggle" type="button" aria-label="Open menu" aria-expanded="false"><i data-lucide="menu"></i></button>
  <div style="display:flex;align-items:center;gap:.6rem;flex:1;min-width:0">
    <div class="sidebar-avatar" id="mobileAvatar">R</div>
    <div style="min-width:0"><div style="font-weight:700;font-size:.9rem" id="mobileName"></div><div class="text-muted" style="font-size:.75rem" id="mobileRole"></div></div>
  </div>
</div>

<div class="dashboard-shell" id="dashboardShell">
  <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>
  <aside class="sidebar" id="dashboardSidebar">
    <div class="sidebar-profile">
      <div class="sidebar-avatar" id="sidebarAvatar">R</div>
      <div class="sidebar-profile-text"><div style="font-weight:700" id="sidebarName"></div><div class="text-muted" style="font-size:.78rem" id="sidebarRole"></div></div>
    </div>
    <ul class="sidebar-nav" id="sidebarNav"></ul>
    <button class="sidebar-logout" id="sidebarLogout" type="button"><i data-lucide="log-out"></i> <span class="sidebar-label">Log out</span></button>
  </aside>

  <main class="dashboard-main">
    <!-- OVERVIEW -->
    <div id="tab-overview">
      <h2 id="overviewTitle">Overview</h2>
      <div id="statCards"></div>
      <div class="card" style="padding:1.3rem">
        <h3 style="margin-bottom:.8rem">Recent activity</h3>
        <div id="recentActivity"></div>
      </div>
    </div>

    <!-- REQUESTS (seeker) -->
    <div id="tab-requests" style="display:none">
      <h2>My requests</h2>
      <div id="requestsLegend" class="status-legend"></div>
      <div id="requestsList"></div>
    </div>

    <!-- LISTINGS (owner) -->
    <div id="tab-listings" style="display:none">
      <div class="section-head"><h2 style="margin:0">My listings</h2><a href="/post-ad" class="btn btn-primary btn-sm">+ New listing</a></div>
      <div id="ownerListings"></div>
    </div>

    <!-- FAVORITES (seeker) -->
    <div id="tab-favorites" style="display:none">
      <h2>Saved rooms</h2>
      <div class="grid-3" id="favoritesList"></div>
    </div>

    <!-- NOTIFICATIONS -->
    <div id="tab-notifications" style="display:none">
      <h2>Notifications</h2>
      <div class="card" id="notificationsList"></div>
    </div>

    <!-- ACCOUNT -->
    <div id="tab-account" style="display:none">
      <h2>Account</h2>
      <div id="accountPanel"></div>
    </div>
  </main>
</div>

<nav class="footer-nav" id="footerNav" data-mode="visitor"></nav>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<script src="/js/app.js" defer></script>
<script src="/js/dashboard.js" defer></script>
<script src="/js/footernav.js" defer></script>
<script src="/js/animations.js" defer></script>
<script src="/js/scrolltop.js" defer></script>
</body>
</html>
