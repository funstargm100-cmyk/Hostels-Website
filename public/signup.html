<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create account — Roomy</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="toastContainer"></div>

<nav class="navbar" id="mainNav">
  <div class="nav-inner">
    <a href="/" class="logo">roomy<span class="dot">.</span></a>
    <div class="nav-links">
      <a href="/listings">Browse rooms</a>
      <a href="/post-ad">Post a room</a>
      <a href="/about">About</a>
    </div>
    <div class="nav-actions">
      <button id="themeToggle" aria-label="Toggle theme"></button>
    </div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <div class="logo mb-1">roomy<span class="dot">.</span></div>
    <h2 style="font-size:1.4rem">Create your account</h2>
    <p class="text-muted mb-3" style="margin-top:-.4rem">Find a room, or list one — takes under a minute.</p>

    <div class="alert alert-danger" id="signupError" style="display:none"></div>

    <form id="signupForm">
      <div class="role-toggle">
        <label><input type="radio" name="role" value="seeker" checked /><span>I'm looking for a room</span></label>
        <label><input type="radio" name="role" value="owner" /><span>I'm listing a room</span></label>
      </div>
      <div class="form-group">
        <label>Full name</label>
        <input type="text" id="suName" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="suEmail" />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="suPhone" placeholder="0XX XXX XXXX" />
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="suPassword" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%" id="signupSubmitBtn">Create account</button>
    </form>

    <p class="text-muted mt-3" style="text-align:center;font-size:.88rem">Already have an account? <a href="/login" style="color:var(--primary);font-weight:700">Log in</a></p>
  </div>
</div>

<footer class="site-footer" style="padding:2rem 0">
  <div class="container footer-bottom" style="border-top:none">
    <span>© 2026 Roomy.</span>
    <a href="/about">About &amp; safety</a>
  </div>
</footer>

<nav class="footer-nav" id="footerNav"></nav>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<script src="/js/app.js" defer></script>
<script src="/js/footernav.js" defer></script>
<script src="/js/animations.js" defer></script>
<script src="/js/scrolltop.js" defer></script>
<script defer>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('signupSubmitBtn');
  const errEl = document.getElementById('signupError');
  errEl.style.display = 'none';
  const email = document.getElementById('suEmail').value.trim();
  const phone = document.getElementById('suPhone').value.trim();
  if (!email && !phone) { errEl.textContent = 'Provide an email or phone number.'; errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.classList.add('btn-loading');
  try {
    const { token, user } = await api.post('/api/auth/signup', {
      name: document.getElementById('suName').value.trim(),
      email: email || undefined,
      phone: phone || undefined,
      password: document.getElementById('suPassword').value,
      role: document.querySelector('input[name="role"]:checked').value
    });
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(user));
    location.href = '/dashboard';
  } catch (ex) {
    errEl.textContent = ex.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.classList.remove('btn-loading');
  }
});
</script>
</body>
</html>
