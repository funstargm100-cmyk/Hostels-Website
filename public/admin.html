<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — Roomy</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="toastContainer"></div>

<nav class="navbar" id="mainNav">
  <div class="nav-inner">
    <a href="/" class="logo">roomy<span class="dot">.</span></a>
    <div class="nav-actions">
      <button id="themeToggle" aria-label="Toggle theme"></button>
      <button id="logoutBtn" class="btn btn-ghost btn-sm">Log out</button>
    </div>
  </div>
</nav>

<div class="dashboard-shell">
  <aside class="sidebar">
    <div class="sidebar-profile">
      <div class="sidebar-avatar" style="background:var(--teal)">A</div>
      <div><div style="font-weight:700">Admin panel</div><div class="text-muted" style="font-size:.78rem">Moderation &amp; ops</div></div>
    </div>
    <ul class="sidebar-nav">
      <li><a href="#" class="active" onclick="showAdminTab('overview',this);return false"><i data-lucide="layout-dashboard"></i> Overview</a></li>
      <li><a href="#" onclick="showAdminTab('listings',this);return false"><i data-lucide="building-2"></i> Listings</a></li>
      <li><a href="#" onclick="showAdminTab('requests',this);return false"><i data-lucide="message-circle"></i> Requests</a></li>
      <li><a href="#" onclick="showAdminTab('users',this);return false"><i data-lucide="users"></i> Users</a></li>
      <li><a href="#" onclick="showAdminTab('reports',this);return false"><i data-lucide="flag"></i> Reports</a></li>
      <li><a href="#" onclick="showAdminTab('logs',this);return false"><i data-lucide="scroll-text"></i> Audit logs</a></li>
    </ul>
  </aside>

  <main class="dashboard-main">
    <div id="admin-tab-overview">
      <h2>Overview</h2>
      <div id="adminStats"></div>
    </div>

    <div id="admin-tab-listings" style="display:none">
      <div class="section-head">
        <h2 style="margin:0">Listings</h2>
        <select id="listingStatusFilter" onchange="loadAdminListings()" style="width:auto">
          <option value="pending">Pending review</option>
          <option value="active">Active</option>
          <option value="deactivated">Deactivated</option>
        </select>
      </div>
      <div id="adminListingsTable"></div>
    </div>

    <div id="admin-tab-requests" style="display:none">
      <div class="section-head">
        <h2 style="margin:0">Requests</h2>
        <select id="requestStatusFilter" onchange="loadAdminRequests()" style="width:auto">
          <option value="">All statuses</option>
          <option value="new">New</option>
          <option value="in_progress">In progress</option>
          <option value="connected">Connected</option>
          <option value="closed">Closed</option>
        </select>
      </div>
      <div id="adminRequestsTable"></div>
    </div>

    <div id="admin-tab-users" style="display:none">
      <div class="section-head">
        <h2 style="margin:0">Users</h2>
        <select id="userRoleFilter" onchange="loadAdminUsers()" style="width:auto">
          <option value="">All roles</option>
          <option value="seeker">Seekers</option>
          <option value="owner">Owners</option>
          <option value="agent">Agents</option>
          <option value="admin">Admins</option>
        </select>
      </div>
      <div id="adminUsersTable"></div>
    </div>

    <div id="admin-tab-reports" style="display:none">
      <h2>Open reports</h2>
      <div id="adminReportsTable"></div>
    </div>

    <div id="admin-tab-logs" style="display:none">
      <h2>Audit logs</h2>
      <div id="adminLogsTable"></div>
    </div>
  </main>
</div>

<!-- Reject listing modal -->
<div class="modal-overlay" id="rejectModal">
  <div class="modal">
    <h3>Reject listing</h3>
    <div class="form-group"><label>Reason</label><textarea id="rejectReason" placeholder="Explain why this listing is being rejected"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('rejectModal')">Cancel</button>
      <button class="btn btn-primary" onclick="confirmReject()">Reject listing</button>
    </div>
  </div>
</div>

<!-- Delete listing modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <h3>Delete listing</h3>
    <p class="text-muted">This permanently removes the listing. This can't be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('deleteModal')">Cancel</button>
      <button class="btn btn-primary" style="background:var(--brick)" onclick="confirmDelete()">Delete permanently</button>
    </div>
  </div>
</div>

<!-- Update request modal -->
<div class="modal-overlay" id="requestModal">
  <div class="modal">
    <h3>Update request</h3>
    <div class="form-group">
      <label>Status</label>
      <select id="newRequestStatus">
        <option value="new">New</option>
        <option value="in_progress">In progress</option>
        <option value="connected">Connected</option>
        <option value="closed">Closed</option>
      </select>
    </div>
    <div class="form-group"><label>Admin notes</label><textarea id="adminNotes" placeholder="Internal notes (not shared with users)"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('requestModal')">Cancel</button>
      <button class="btn btn-primary" onclick="updateRequestStatus()">Save</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<script src="/js/app.js" defer></script>
<script src="/js/admin.js" defer></script>
<script src="/js/animations.js" defer></script>
</body>
</html>
