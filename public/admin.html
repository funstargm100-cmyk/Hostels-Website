<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Roomy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand"><i data-lucide="home"></i> <span class="brand-roomy">Roomy</span> <span class="badge badge-primary" style="font-size:0.65rem">ADMIN</span></a>
      <div class="navbar-actions">
        <button class="theme-toggle" id="themeToggle"><i data-lucide="moon"></i></button>
        <a href="/" class="btn btn-ghost btn-sm">← Site</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="dashboard-layout">
      <aside class="sidebar">
        <ul class="sidebar-nav">
          <li><a href="#overview" class="active" onclick="showAdminTab('overview',this)"><i data-lucide="layout-dashboard"></i> Overview</a></li>
          <li><a href="#listings" onclick="showAdminTab('listings',this)"><i data-lucide="building-2"></i> Listings Queue</a></li>
          <li><a href="#requests" onclick="showAdminTab('requests',this)"><i data-lucide="message-circle"></i> Contact Requests</a></li>
          <li><a href="#users" onclick="showAdminTab('users',this)"><i data-lucide="users"></i> Users</a></li>
          <li><a href="#reports" onclick="showAdminTab('reports',this)"><i data-lucide="flag"></i> Reports</a></li>
          <li><a href="#logs" onclick="showAdminTab('logs',this)"><i data-lucide="clipboard-list"></i> Audit Logs</a></li>
        </ul>
      </aside>

      <main>
        <div id="admin-tab-overview">
          <h2 class="mb-3">Platform overview</h2>
          <div class="stat-cards" id="adminStats"></div>
        </div>

        <div id="admin-tab-listings" style="display:none">
          <div class="flex-between mb-3">
            <h2>Listings moderation</h2>
            <select class="form-control" id="listingStatusFilter" style="width:auto" onchange="loadAdminListings()">
              <option value="pending">Pending Review</option>
              <option value="active">Active</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
          <div id="adminListingsTable"></div>
        </div>

        <div id="admin-tab-requests" style="display:none">
          <div class="flex-between mb-3">
            <h2>Contact requests</h2>
            <select class="form-control" id="requestStatusFilter" style="width:auto" onchange="loadAdminRequests()">
              <option value="received">New</option>
              <option value="in_progress">In Progress</option>
              <option value="connected">Connected</option>
              <option value="closed">Closed</option>
              <option value="">All</option>
            </select>
          </div>
          <div id="adminRequestsTable"></div>
        </div>

        <div id="admin-tab-users" style="display:none">
          <div class="flex-between mb-3">
            <h2>User management</h2>
            <select class="form-control" id="userRoleFilter" style="width:auto" onchange="loadAdminUsers()">
              <option value="">All Users</option>
              <option value="seeker">Seekers</option>
              <option value="owner">Owners</option>
              <option value="agent">Agents</option>
            </select>
          </div>
          <div id="adminUsersTable"></div>
        </div>

        <div id="admin-tab-reports" style="display:none">
          <h2 class="mb-3">Flagged reports</h2>
          <div id="adminReportsTable"></div>
        </div>

        <div id="admin-tab-logs" style="display:none">
          <h2 class="mb-3">Audit logs</h2>
          <div id="adminLogsTable"></div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="requestModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Update Request Status</h3>
        <button class="modal-close" onclick="closeModal('requestModal')">✕</button>
      </div>
      <div id="requestModalDetails" class="mb-3" style="font-size:0.875rem;color:var(--text-muted)"></div>
      <div class="form-group">
        <label class="form-label">New Status</label>
        <select class="form-control" id="newRequestStatus">
          <option value="received">Received</option>
          <option value="in_progress">In Progress</option>
          <option value="connected">Connected</option>
          <option value="closed">Closed</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Admin Notes</label>
        <textarea class="form-control" id="adminNotes" rows="3" placeholder="Internal notes..."></textarea>
      </div>
      <button class="btn btn-primary btn-block" onclick="updateRequestStatus()">Update Status</button>
    </div>
  </div>

  <div class="modal-overlay" id="rejectModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Reject Listing</h3>
        <button class="modal-close" onclick="closeModal('rejectModal')">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">Rejection Reason *</label>
        <textarea class="form-control" id="rejectReason" rows="3" placeholder="Explain why this listing is being rejected..." required></textarea>
      </div>
      <button class="btn btn-primary btn-block" onclick="confirmReject()">Confirm Rejection</button>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script>lucide.createIcons();</script>
  <script src="/js/animations.js"></script>
</body>
</html>
