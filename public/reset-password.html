
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset password — Roomy</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="toastContainer"></div>

<nav class="navbar" id="mainNav">
  <div class="nav-inner">
    <a href="/" class="logo">roomy<span class="dot">.</span></a>
    <div class="nav-links">
      <a href="/listings">Browse rooms</a>
      <a href="/post-ad">Post a room</a>
      <a href="/about">About</a>
    </div>
    <div class="nav-actions">
      <button id="themeToggle" aria-label="Toggle theme"></button>
    </div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <h2 style="font-size:1.4rem">Choose a new password</h2>
    <p class="text-muted mb-3" style="margin-top:-.4rem">Enter a new password for your account.</p>

    <div class="alert alert-danger" id="resetError" style="display:none"></div>
    <div class="alert alert-success" id="resetSuccess" style="display:none"></div>

    <form id="resetForm">
      <div class="form-group">
        <label>New password</label>
        <input type="password" id="newPassword" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters" />
      </div>
      <div class="form-group">
        <label>Confirm new password</label>
        <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%" id="resetSubmitBtn">Reset password</button>
    </form>

    <p class="text-muted mt-3" id="resetFootnote" style="text-align:center;font-size:.88rem">
      <a href="/login" style="color:var(--primary);font-weight:700">Back to log in</a>
    </p>
  </div>
</div>

<footer class="site-footer" style="padding:2rem 0">
  <div class="container footer-bottom" style="border-top:none">
    <span>© 2026 Roomy.</span>
    <a href="/about">About &amp; safety</a>
  </div>
</footer>

<nav class="footer-nav" id="footerNav"></nav>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<script src="/js/app.js" defer></script>
<script src="/js/footernav.js" defer></script>
<script src="/js/animations.js" defer></script>
<script src="/js/scrolltop.js" defer></script>
<script defer>
const errEl = document.getElementById('resetError');
const okEl = document.getElementById('resetSuccess');
const resetForm = document.getElementById('resetForm');
const token = new URLSearchParams(location.search).get('token') || '';

function fail(msg) {
  errEl.textContent = msg;
  errEl.style.display = 'block';
  okEl.style.display = 'none';
}

function showTokenProblem() {
  resetForm.style.display = 'none';
  document.getElementById('resetFootnote').innerHTML =
    '<a href="/login" style="color:var(--primary);font-weight:700">Back to log in</a>' +
    ' · <a href="/login" style="color:var(--primary);font-weight:700">Request a new link</a>';
}

if (!token) {
  fail('This reset link is invalid or missing. Please request a new one from the login page.');
  showTokenProblem();
}

resetForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('resetSubmitBtn');
  const password = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  errEl.style.display = 'none';
  okEl.style.display = 'none';

  if (password.length < 6) return fail('Password must be at least 6 characters');
  if (password !== confirm) return fail('Passwords do not match');

  btn.disabled = true; btn.classList.add('btn-loading');
  try {
    const res = await api.post('/api/auth/reset-password', { token, password });
    okEl.textContent = res.message || 'Password reset successful! You can now log in.';
    okEl.style.display = 'block';
    resetForm.style.display = 'none';
    document.getElementById('resetFootnote').innerHTML =
      '<a href="/login?reset=1" style="color:var(--primary);font-weight:700">Continue to log in</a>';
  } catch (ex) {
    fail(ex.message || 'Could not reset your password. Please request a new link.');
    // An invalid/expired token can't be retried — offer a fresh link.
    if (/expired|invalid/i.test(ex.message || '')) showTokenProblem();
  } finally {
    btn.disabled = false; btn.classList.remove('btn-loading');
  }
});
</script>
</body>
</html>
